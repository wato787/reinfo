[tools]
bun = "1.3.13"

[tasks.install]
description = "依存関係をインストールする"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Web UI と Worker API を開発モードで起動する"
run = "bun run dev"

[tasks.format]
description = "Oxfmt でコードを整形する"
run = "bun run format"

[tasks.lint]
description = "Oxlint を実行する"
run = "bun run lint"

[tasks.typecheck]
description = "TypeScript の型チェックを実行する"
run = "bun run typecheck"

[tasks.test]
description = "単体テストを実行する"
run = "bun run test"

[tasks.build]
description = "Cloudflare Worker 用にビルドする"
run = "bun run build"

[tasks."db:generate"]
description = "Drizzle schema から D1 用の SQL migration を生成する"
run = "bun run db:generate"

[tasks.check]
description = "format、lint、typecheck、test、build をまとめて確認する"
run = "bun run check"
